name: ci
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  # gbforge-core (analyzer + codegen) and a GBA build with the pinned Arm GNU Toolchain, on each host OS
  port-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v6
        with:
          path: build/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/fetch_toolchain.py') }}
      - run: python scripts/fetch_toolchain.py
      - run: cmake -G Ninja -B build/core . && cmake --build build/core --target gbforge-core
      - run: python tools/gb2gba.py analyze tests/fixtures/tiny/tiny.gb --out build/tiny
      - run: python tools/gb2gba.py port tests/fixtures/tiny/tiny.gb --output out/tiny.gba
      - run: python tools/gb2gba.py port tests/fixtures/acid2/cgb-acid2.gbc --output out/cgb-acid2.gba --allow-unresolved
      # A Korean Windows user name puts Hangul in %TEMP% and the Desktop: the same port from such a folder (Windows binutils
      # lose characters of non-ASCII paths), byte for byte
      - name: port from a non-ASCII folder
        shell: bash
        timeout-minutes: 10
        run: |
          set -x
          d="$RUNNER_TEMP/한글 사용자"
          mkdir -p "$d/gbforge/build/core" "$d/tmp"
          cp -R tools runtime-gba "$d/gbforge/"
          cp build/core/gbforge-core* "$d/gbforge/build/core/"
          cp -R build/toolchain "$d/gbforge/build/"
          TEMP="$d/tmp" TMP="$d/tmp" TMPDIR="$d/tmp" PYTHONIOENCODING=utf-8 timeout 300 python -u "$d/gbforge/tools/gb2gba.py" port tests/fixtures/tiny/tiny.gb --output "$d/tiny.gba" < /dev/null
          cmp out/tiny.gba "$d/tiny.gba"
      - uses: actions/upload-artifact@v7
        with:
          name: port-${{ runner.os }}
          path: |
            out/*.gba
            out/tiny.map.json
            out/tiny.report.json

  # A patch made against a port (e.g. a translation) only applies if every host builds the same bytes
  same-bytes:
    needs: port-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: port-*
      - run: |
          sha256sum port-*/*.gba | sort -k2
          for g in tiny cgb-acid2; do
            [ "$(sha256sum port-*/$g.gba | cut -d' ' -f1 | sort -u | wc -l)" = 1 ] || { echo "$g.gba differs between hosts"; exit 1; }
          done
